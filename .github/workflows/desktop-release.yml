name: Desktop release

# Publishes a Windows release in this repository (it must be public: the
# installed app reads releases without a token). Manual only: it never runs on
# push or pull request. Uses the workflow's own GITHUB_TOKEN.
#
# Optional repository secrets (set by the owner — never committed):
#   CSC_LINK          base64 of the code-signing .pfx (until then the build is unsigned)
#   CSC_KEY_PASSWORD  its password
# Every installed app checks that repository every 30 minutes, downloads the new
# version in the background and offers "Install now" or "Later" (Later installs
# it when the app is closed). Nobody has to reinstall.

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version, higher than the last release (e.g. 0.1.1)
        required: true
      notes:
        description: What's new (shown in the app's update prompt)
        required: true
      confirm:
        description: Type "publish" to create a public release
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    if: inputs.confirm == 'publish'
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3, got '$env:VERSION'" }
          Set-Content -Path desktop/release-notes.md -Value $env:NOTES

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          bun install --frozen-lockfile
          cd desktop
          bun install --frozen-lockfile

      - name: Build the pipeline runtime
        working-directory: desktop
        shell: pwsh
        run: node scripts/build-sidecar.mjs --python-home "$env:pythonLocation"

      - name: Build the app
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          bun run typecheck
          bun run build

      - name: Package and sign (when a certificate is set)
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $env:CSC_LINK) {
            Write-Warning 'No code-signing certificate: the installer will be unsigned and Windows SmartScreen will warn users.'
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          }
          # Build only. electron-builder's own publishing creates one release per uploaded
          # file when they upload in parallel; the release is created below in one call.
          bunx electron-builder --win --publish never "-c.extraMetadata.version=$env:VERSION"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = "v$env:VERSION"
          $repo = $env:GITHUB_REPOSITORY
          $files = @("desktop/release/Clipfarm-Studio-Setup-$env:VERSION.exe", "desktop/release/Clipfarm-Studio-Setup-$env:VERSION.exe.blockmap", 'desktop/release/latest.yml')
          foreach ($file in $files) { if (-not (Test-Path $file)) { throw "Missing $file" } }
          Get-Content desktop/release/latest.yml

          # Leftovers of failed runs for this version: drafts, or a release without an installer.
          $releases = gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json
          foreach ($release in $releases | Where-Object { $_.name -eq $tag -or $_.tag_name -eq $tag }) {
            $hasInstaller = $release.assets | Where-Object { $_.name -like '*.exe' }
            if (-not $release.draft -and $hasInstaller) { throw "Release $tag already exists with an installer. Choose a higher version." }
            Write-Host "Removing leftover release $($release.id) ($($release.tag_name), draft=$($release.draft))"
            gh api -X DELETE "repos/$repo/releases/$($release.id)"
          }
          $PSNativeCommandUseErrorActionPreference = $false
          gh api -X DELETE "repos/$repo/git/refs/tags/$tag" 2>$null
          $PSNativeCommandUseErrorActionPreference = $true

          gh release create $tag @files --repo $repo --target $env:GITHUB_SHA --title "Clipfarm Studio for Windows $env:VERSION" --notes-file desktop/release-notes.md --latest
          gh release view $tag --repo $repo --json url,isDraft,isPrerelease,tagName,assets
