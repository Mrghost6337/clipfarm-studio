name: Desktop release

# Publishes a Windows release in this repository (it must be public: the
# installed app reads releases without a token). Manual only: it never runs on
# push or pull request. Uses the workflow's own GITHUB_TOKEN.
#
# Optional repository secrets (set by the owner — never committed):
#   CSC_LINK          base64 of the code-signing .pfx (until then the build is unsigned)
#   CSC_KEY_PASSWORD  its password
# Every installed app checks that repository every 30 minutes, downloads the new
# version in the background and offers "Install now" or "Later" (Later installs
# it when the app is closed). Nobody has to reinstall.

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version, higher than the last release (e.g. 0.1.1)
        required: true
      notes:
        description: What's new (shown in the app's update prompt)
        required: true
      confirm:
        description: Type "publish" to create a public release
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    if: inputs.confirm == 'publish'
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3, got '$env:VERSION'" }
          Set-Content -Path desktop/release-notes.md -Value $env:NOTES

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          bun install --frozen-lockfile
          cd desktop
          bun install --frozen-lockfile

      - name: Build the pipeline runtime
        working-directory: desktop
        shell: pwsh
        run: node scripts/build-sidecar.mjs --python-home "$env:pythonLocation"

      - name: Build the app
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          bun run typecheck
          bun run build

      - name: Package, sign (when a certificate is set) and publish
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $env:CSC_LINK) {
            Write-Warning 'No code-signing certificate: the installer will be unsigned and Windows SmartScreen will warn users.'
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          }
          # A release of this version without an installer is a failed earlier run: remove it first.
          $tag = "v$env:VERSION"
          $PSNativeCommandUseErrorActionPreference = $false
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets 2>$null
          $found = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $true
          if ($found) {
            $existing = $existing | ConvertFrom-Json
            if ($existing.assets | Where-Object { $_.name -like '*.exe' }) { throw "Release $tag already exists with an installer. Choose a higher version." }
            Write-Host "Removing the incomplete release $tag"
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
          }
          # Upload everything to a draft first: electron-builder uploads files in parallel, and
          # each upload would otherwise try to create the published release (GitHub answers 422).
          bunx electron-builder --win --publish always "-c.extraMetadata.version=$env:VERSION" "-c.releaseInfo.releaseNotesFile=release-notes.md" "-c.publish.releaseType=draft"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = "v$env:VERSION"
          $assets = (gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json).assets.name
          Write-Host "Assets: $($assets -join ', ')"
          foreach ($needed in @("Clipfarm-Studio-Setup-$env:VERSION.exe", "Clipfarm-Studio-Setup-$env:VERSION.exe.blockmap", 'latest.yml')) {
            if ($assets -notcontains $needed) { throw "The draft is missing $needed" }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest --target $env:GITHUB_SHA --title "Clipfarm Studio for Windows $env:VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,isDraft,tagName
